name: solo52-fieldtrace
services:
  bench:
    build:
      context: .
      args:
        FIELDTRACE_DEPS_IMAGE: ${FIELDTRACE_DEPS_IMAGE:-python:3.11-slim}
    image: ${FIELDTRACE_IMAGE:-solo52-fieldtrace:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${FIELDTRACE_PORT:-19952}:8000"
    volumes:
      - survey-library:/var/lib/fieldtrace
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  survey-library:
